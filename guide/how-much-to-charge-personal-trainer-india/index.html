        {"@type":"Question","name":"Should I charge per session or per month?","acceptedAnswer":{"@type":"Answer","text":"Both have a place. Monthly or bulk packages give clients a reason to commit and give you steadier income, so many trainers make packages the default and add a modest premium for one-off sessions. Whatever you choose, write the terms down and quote them consistently."}},
        {"@type":"Question","name":"How do I raise my rates without losing clients?","acceptedAnswer":{"@type":"Answer","text":"Raise them for new clients first, give existing clients clear notice, and tie the conversation to the value and results you deliver. Trainers with a clear specialisation and a professional, reliable service have far more room to raise rates than generalists competing on price."}},
