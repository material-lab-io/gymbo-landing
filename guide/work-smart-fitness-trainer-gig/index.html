          {"@type":"HowToStep","name":"Run everything from your phone","text":"Keep your client list, schedule, session counts, and payments in one place instead of spread across WhatsApp, a diary, UPI history, and memory."},

        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {"@type":"Question","name":"What does it mean to work smart as a personal trainer?","acceptedAnswer":{"@type":"Answer","text":"Shrinking the admin around your training — session-counting, payment-chasing, scheduling, and reminders — so it takes minutes a day instead of hours, by running your one-person business from one place on your phone and logging sessions and payments as they happen."}},
          {"@type":"Question","name":"How can a fitness trainer save time on admin?","acceptedAnswer":{"@type":"Answer","text":"Log each session the moment it ends, record every payment against the client and package, keep one schedule you trust, and batch the rest into a single five-minute daily review. The time-sink is re-counting and reconciling from memory."}},
          {"@type":"Question","name":"Can I run my whole training business from my phone?","acceptedAnswer":{"@type":"Answer","text":"Yes. A solo trainer's business is a client list, a schedule, session counts, and payments, all of which fit on a phone. Most start on WhatsApp, a diary, and UPI, then move to a single app once juggling those by hand gets heavy, usually around 15 clients."}},
          {"@type":"Question","name":"How many clients can an independent trainer handle solo?","acceptedAnswer":{"@type":"Answer","text":"There's no fixed number — it depends on session length, travel, and admin load. The practical ceiling is usually admin, not training capacity. Cut the counting and chasing and the same hours hold more clients."}},
