        {"@type":"Question","name":"Should personal trainers charge for no-shows?","acceptedAnswer":{"@type":"Answer","text":"Most independent trainers do, because a booked slot they can't resell is lost income. The fair way is to set a clear policy in advance, tell every client at sign-up, and apply it evenly. Charging for a genuine no-show is reasonable when the rules were known upfront."}},
        {"@type":"Question","name":"What is a reasonable cancellation notice period for personal training?","acceptedAnswer":{"@type":"Answer","text":"24 hours is the most common default, though some trainers use 12 or 48 depending on how quickly they can fill a slot. The specific number matters less than setting one, communicating it at sign-up, and applying it consistently to everyone."}},
        {"@type":"Question","name":"How do I enforce a no-show policy without upsetting clients?","acceptedAnswer":{"@type":"Answer","text":"Introduce it at sign-up so it's never a surprise, send a friendly reminder before each session, apply it evenly to all clients, and keep an accurate record so a missed session is a shared fact rather than an argument. Fairness and consistency do the work, not toughness."}},
        {"@type":"Question","name":"Do reminders actually reduce no-shows?","acceptedAnswer":{"@type":"Answer","text":"Yes. Reminders help because many missed sessions come down to simple forgetfulness rather than a client dropping out — so a short, personal reminder the day before heads them off. In practice it prevents more no-shows than a penalty does, because it stops the missed session happening rather than just charging for it afterwards."}}
