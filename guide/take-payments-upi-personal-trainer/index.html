        {"@type":"Question","name": "How do personal trainers take payments in India?","acceptedAnswer":{"@type":"Answer","text": "Many use UPI (GPay, PhonePe, Paytm or a bank app), using a UPI ID or QR code. UPI payments are instant and widely used, so your clients are likely to have it already. The key is to record each payment against the client and package so your balances stay accurate, rather than leaving it in your UPI history."}},
        {"@type":"Question","name": "Do I need a payment gateway to accept UPI as a trainer?","acceptedAnswer":{"@type":"Answer","text": "No. For one-to-one client payments you can accept UPI directly with your own UPI ID or QR code, no gateway required. A gateway is for businesses taking online card/UPI payments at scale; a solo trainer collecting from known clients doesn't need that layer."}},
        {"@type":"Question","name": "How do I keep track of who has paid?","acceptedAnswer":{"@type":"Answer","text": "Record every payment against the specific client and package the moment it lands, so your paid-minus-used balance is always current. Relying on your UPI app's history means reconstructing the month later, which is where trainers lose track and miss renewals. A notebook works for a few clients; an app that reconciles balances helps once the roster grows."}},
        {"@type":"Question","name": "Should I give clients a receipt for UPI payments?","acceptedAnswer":{"@type":"Answer","text": "Yes. A clean statement or receipt looks professional, builds trust, and settles any \"did I pay?\" question with a record instead of memory. It's one of the easiest ways to make a one-person business feel like a real one."}}
      ]
