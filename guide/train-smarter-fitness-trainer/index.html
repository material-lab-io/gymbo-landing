          {"@type":"HowToStep","name":"Treat attendance as your leading indicator","text":"Track every session so you can see at a glance who is consistent and who is drifting."},

          {"@type":"HowToStep","name":"Adjust the plan off real patterns","text":"Use the client's actual session history — gaps, streaks, busy periods — to shape a programme that fits their real life."},

        "@context": "https://schema.org",

        "mainEntity": [
          {"@type":"Question","name":"What does it mean to train clients smarter?","acceptedAnswer":{"@type":"Answer","text":"Letting real patterns — especially attendance and consistency over time — guide your coaching rather than reacting only to the last session. A clear session history lets you spot a fading client early and adjust while it's fixable. Your expertise writes the programme; the record tells you when to act."}},
          {"@type":"Question","name":"How can I tell if a client is losing motivation?","acceptedAnswer":{"@type":"Answer","text":"Watch the trend, not a single session. One missed session is normal; a cluster of gaps over a couple of weeks is an early warning. Trainers who track attendance can see the slide starting and re-engage before the client quietly stops."}},
          {"@type":"Question","name":"Do I need special software to track client progress?","acceptedAnswer":{"@type":"Answer","text":"No — a diary works for a small roster. What you need is a session history you'll actually review. Software earns its place once keeping an accurate, glanceable record by hand becomes a chore you skip; then an app that logs attendance keeps the pattern visible without extra work."}},
          {"@type":"Question","name":"Does tracking attendance really improve results?","acceptedAnswer":{"@type":"Answer","text":"Indirectly but strongly: results depend on consistency, and you can only support consistency you can see. Tracking attendance turns a vague impression into a clear pattern, so you catch drop-off early and protect the results and renewals that follow from showing up."}},
