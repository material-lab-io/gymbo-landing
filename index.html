<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <script>try{var t=localStorage.getItem('gymbo-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gymbo — Business app for fitness trainers</title>
    <meta name="description" content="AI-powered business app for independent personal trainers. Log sessions, track payments, manage clients. From ₹399/mo, first month free." />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://getgymbo.com/" />
    <meta property="og:title" content="Gymbo — Business app for fitness trainers" />
    <meta property="og:description" content="AI-powered business app for independent personal trainers. Log sessions, track payments, manage clients." />
    <meta property="og:image" content="https://getgymbo.com/og-image.png" />
    <meta property="og:site_name" content="Gymbo" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Gymbo — Business app for fitness trainers" />
    <meta name="twitter:description" content="AI-powered business app for independent personal trainers." />
    <meta name="twitter:image" content="https://getgymbo.com/og-image.png" />

    <!-- Theme -->
    <meta name="theme-color" content="#0A0A0A" />
    <link rel="canonical" href="https://getgymbo.com/" />

    <!-- JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Gymbo",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "iOS",
      "description": "AI-powered business app for independent personal trainers. Log sessions, track payments, manage clients.",
      "url": "https://getgymbo.com",
      "offers": {
        "@type": "Offer",
        "price": "399",
        "priceCurrency": "INR",
        "billingIncrement": "P1M"
      },
      "author": {
        "@type": "Organization",
        "name": "Material Lab",
        "url": "https://materiallab.io"
      }
    }
    </script>

    <!-- FAQ schema (mirrors the on-page homepage FAQ) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Is it free?",
          "acceptedAnswer": { "@type": "Answer", "text": "Your first month is free on every plan. After that, Gymbo Pro is ₹399/month — or ₹250/month effective on the annual plan — billed through the App Store." }
        },
        {
          "@type": "Question",
          "name": "Do my clients need to download anything?",
          "acceptedAnswer": { "@type": "Answer", "text": "No. Gymbo is for you, the trainer. Your clients just train — you log it." }
        },
        {
          "@type": "Question",
          "name": "Does it work offline?",
          "acceptedAnswer": { "@type": "Answer", "text": "Yes. Log classes and payments without signal; everything syncs when you're back online." }
        },
        {
          "@type": "Question",
          "name": "Is my client data private?",
          "acceptedAnswer": { "@type": "Answer", "text": "Your client data is yours. You can export it anytime, and we never contact your clients." }
        },
        {
          "@type": "Question",
          "name": "Which phones does it support?",
          "acceptedAnswer": { "@type": "Answer", "text": "iPhone now. Android is coming soon — join the waitlist and we'll tell you first." }
        },
        {
          "@type": "Question",
          "name": "How do payments work?",
          "acceptedAnswer": { "@type": "Answer", "text": "You record cash or UPI payments yourself. Gymbo keeps the running balance — it doesn't touch your money." }
        },
        {
          "@type": "Question",
          "name": "Can I import my existing clients?",
          "acceptedAnswer": { "@type": "Answer", "text": "Yes. Bring your current roster over in minutes and pick up where you left off." }
        }
      ]
    }
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Analytics (Umami website id from ops/umami/wrangler.toml) -->
    <script defer src="https://analytics.getgymbo.com/script.js" data-website-id="36b8e820-a50a-44b3-a57b-5ee37f719916"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
