<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <script>try{var t=localStorage.getItem('gymbo-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gymbo — Business app for fitness trainers</title>
    <meta name="description" content="AI-powered business app for independent personal trainers. Log sessions, track payments, manage clients. From ₹400/mo, 14 days free." />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://getgymbo.com/" />
    <meta property="og:title" content="Gymbo — Business app for fitness trainers" />
    <meta property="og:description" content="AI-powered business app for independent personal trainers. Log sessions, track payments, manage clients." />
    <meta property="og:image" content="https://getgymbo.com/og-image.png" />
    <meta property="og:site_name" content="Gymbo" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Gymbo — Business app for fitness trainers" />
    <meta name="twitter:description" content="AI-powered business app for independent personal trainers." />
    <meta name="twitter:image" content="https://getgymbo.com/og-image.png" />

    <!-- Theme -->
    <meta name="theme-color" content="#0A0A0A" />
    <link rel="canonical" href="https://getgymbo.com/" />

    <!-- JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "@id": "https://getgymbo.com/#app",
      "name": "Gymbo",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "iOS",
      "description": "AI-powered business app for independent personal trainers. Log sessions, track payments, manage clients.",
      "url": "https://getgymbo.com",
      "offers": {
        "@type": "Offer",
        "price": "400",
        "priceCurrency": "INR"
      },
      "author": {
        "@type": "Organization",
        "name": "Material Lab",
        "url": "https://materiallab.io"
      },
      "publisher": { "@id": "https://getgymbo.com/#organization" }
    }
    </script>

    <!-- Entity anchor: the Gymbo Organization + its founder, referenced by @id from
         every page's Article/Dataset/publisher schema (gy-k2543.17 entity schema depth).
         NAP (name/url/logo) must match byte-for-byte everywhere. No foundingDate — the
         canonical founding year is unconfirmed, so it is omitted rather than invented.
         No sameAs yet: Gymbo has no live external directory/social profile (all
         listings are not_started; the app is pre-App-Store). The parent studio is
         modelled as parentOrganization (its LinkedIn is Material Lab's, not Gymbo's).
         When directory listings go live, add their URLs to a "sameAs" array here. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "@id": "https://getgymbo.com/#organization",
      "name": "Gymbo",
      "url": "https://getgymbo.com",
      "logo": {
        "@type": "ImageObject",
        "url": "https://getgymbo.com/logo.png"
      },
      "description": "Gymbo is an app built for India's independent personal trainers — to track client sessions, payments, and balances. Built for the trainer, not the gym.",
      "areaServed": { "@type": "Country", "name": "India" },
      "founder": { "@id": "https://getgymbo.com/#kaushik" },
      "parentOrganization": {
        "@type": "Organization",
        "name": "Material Lab",
        "url": "https://materiallab.io",
        "sameAs": ["https://www.linkedin.com/company/material-lab-io"]
      }
    }
    </script>

    <!-- The founder as a Person entity (E-E-A-T author signal), referenced by @id as
         the author on the /guide/ pillars and the /research/ data report. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "@id": "https://getgymbo.com/#kaushik",
      "name": "Kaushik Naarayan",
      "jobTitle": "Founder",
      "worksFor": { "@id": "https://getgymbo.com/#organization" }
    }
    </script>

    <!-- FAQ schema (mirrors the on-page homepage FAQ) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Is it free?",
          "acceptedAnswer": { "@type": "Answer", "text": "Your first 14 days are free on every plan. After that, Gymbo Pro is ₹400/month — or ₹200/month effective on the annual plan — billed through the App Store." }
        },
        {
          "@type": "Question",
          "name": "Do my clients need to download anything?",
          "acceptedAnswer": { "@type": "Answer", "text": "No. Gymbo is for you, the trainer. Your clients just train — you log it." }
        },
        {
          "@type": "Question",
          "name": "Does it work offline?",
          "acceptedAnswer": { "@type": "Answer", "text": "Yes. Log classes and payments without signal; everything syncs when you're back online." }
        },
        {
          "@type": "Question",
          "name": "Is my client data private?",
          "acceptedAnswer": { "@type": "Answer", "text": "Your client data is yours. You can export it anytime, and we never contact your clients." }
        },
        {
          "@type": "Question",
          "name": "Which phones does it support?",
          "acceptedAnswer": { "@type": "Answer", "text": "iPhone now. Android is coming soon — join the waitlist and we'll tell you first." }
        },
        {
          "@type": "Question",
          "name": "How do payments work?",
          "acceptedAnswer": { "@type": "Answer", "text": "You record cash or UPI payments yourself. Gymbo keeps the running balance — it doesn't touch your money." }
        },
        {
          "@type": "Question",
          "name": "Can I import my existing clients?",
          "acceptedAnswer": { "@type": "Answer", "text": "Yes. Bring your current roster over in minutes and pick up where you left off." }
        }
      ]
    }
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Analytics (Umami website id from ops/umami/wrangler.toml) -->
    <script defer src="https://analytics.getgymbo.com/script.js" data-website-id="36b8e820-a50a-44b3-a57b-5ee37f719916"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
