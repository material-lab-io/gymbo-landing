<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gymbo — Business app for fitness trainers</title>
    <meta name="description" content="AI-powered business app for independent personal trainers. Log sessions, track payments, manage clients. From Rs.200/mo." />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://getgymbo.com/" />
    <meta property="og:title" content="Gymbo — Business app for fitness trainers" />
    <meta property="og:description" content="AI-powered business app for independent personal trainers. Log sessions, track payments, manage clients." />
    <meta property="og:image" content="https://getgymbo.com/og-image.png" />
    <meta property="og:site_name" content="Gymbo" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Gymbo — Business app for fitness trainers" />
    <meta name="twitter:description" content="AI-powered business app for independent personal trainers." />
    <meta name="twitter:image" content="https://getgymbo.com/og-image.png" />

    <!-- Theme -->
    <meta name="theme-color" content="#0A0A0A" />
    <link rel="canonical" href="https://getgymbo.com/" />

    <!-- JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Gymbo",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "iOS",
      "description": "AI-powered business app for independent personal trainers. Log sessions, track payments, manage clients.",
      "url": "https://getgymbo.com",
      "offers": {
        "@type": "Offer",
        "price": "200",
        "priceCurrency": "INR",
        "billingIncrement": "P1M"
      },
      "author": {
        "@type": "Organization",
        "name": "Material Lab",
        "url": "https://materiallab.io"
      }
    }
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />

    <!-- Analytics -->
    <script defer src="https://analytics.getgymbo.com/script.js" data-website-id="gymbo-landing"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
