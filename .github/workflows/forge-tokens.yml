name: Forge Tokens

# Static token-drift gate for getgymbo.com (scripts/check-forge-tokens.mjs).
#
# Fails when a colour literal outside src/forge/ exactly duplicates an existing
# Forge token — i.e. when the design system has been copied rather than used.
# See the script header for why the rule is deliberately narrow and what it does
# NOT cover (rgba alpha variants).
#
# Its own workflow, not a step in deploy.yml: that job is a single sequential
# chain whose first step is the screenshot staleness gate, so anything added to
# it also decides whether the site may be published (gy-7anl3). A token-drift
# failure should say "this copies the design system", never "getgymbo.com may
# not be deployed".
#
# No build, no browser — node only, so it is cheap enough to run on every push.
# Runners: [self-hosted, gt2] per the standing rule. Never *-latest.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  forge-tokens:
    runs-on: [self-hosted, gt2]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # gy-1phkc: the Forge PRODUCER lives in Gymbo-v1. Until this bead, this repo
      # carried an unsynced hand-kept copy and the drift gate below defined SSOT as
      # that copy — so a green meant "internally consistent" and could never mean
      # "matches the design system". It was green while 17 tokens were missing and
      # --g-font-size-micro was 10px against the ratified 11px floor (gy-hhgqi DS2).
      #
      # fetch-depth: 0 is REQUIRED, not tidiness — both gates below read the producer
      # AT A PINNED SHA via `git show`, and a shallow clone does not contain it. Both
      # exit 2 ("could not look") rather than passing if it is missing.
      #
      # GYMBO_V1_PAT already exists in this repo for render-hero-video.yml; this adds
      # no new infrastructure, which is part of why pm ruled vendored+pinned over a
      # published package.
      - name: Check out the Forge producer (Gymbo-v1)
        uses: actions/checkout@v4
        with:
          repository: material-lab-io/Gymbo-v1
          token: ${{ secrets.GYMBO_V1_PAT }}
          path: .forge-producer
          fetch-depth: 0

      # Does the vendored mirror match the pinned producer commit, byte for byte?
      - name: Forge sync — src/forge/ matches the pinned producer
        env:
          FORGE_PRODUCER_DIR: ${{ github.workspace }}/.forge-producer
        run: node scripts/sync-forge-tokens.mjs --check

      # Does the PIN still match the producer's head? Without this, "vendored +
      # pinned" degrades into the original defect with extra steps: a pin nobody
      # touches reports green forever while Forge moves. Narrow on purpose — it
      # fails only when the EMITTED dist files differ, not on every unrelated
      # producer commit, because a noisy gate gets switched off.
      - name: Forge pin is not stale
        env:
          FORGE_PRODUCER_DIR: ${{ github.workspace }}/.forge-producer
        run: node scripts/check-forge-pin-fresh.mjs

      - name: Token drift
        env:
          FORGE_PRODUCER_DIR: ${{ github.workspace }}/.forge-producer
        run: node scripts/check-forge-tokens.mjs

      # 🔴 The token table must come from the PRODUCER, not from the local mirror.
      # check-forge-tokens.mjs falls back to src/forge/ when no producer checkout is
      # present — deliberately, so local runs work — and that fallback is exactly how
      # this gate could silently return to being unfalsifiable if the checkout step
      # above ever breaks or the PAT expires. A fallback that is invisible is a
      # fail-open. Assert in CI that the real source was used.
      - name: Negative control — the gate is reading the PRODUCER, not the local mirror
        env:
          FORGE_PRODUCER_DIR: ${{ github.workspace }}/.forge-producer
        run: |
          node scripts/check-forge-tokens.mjs | tee /tmp/forge-src.log
          if ! grep -q 'table built from the PRODUCER' /tmp/forge-src.log; then
            echo "::error::The token gate fell back to the local vendored mirror. Its SSOT is the copy again, which is the gy-1phkc defect. Do not trust this green."
            exit 1
          fi
          echo "OK  token table sourced from the producer checkout"

      # 🔴 And the cross-repo comparison itself must be shown capable of failing, in
      # the same run that reports it passing — the standing rule in this repo and the
      # explicit close condition on gy-1phkc. Seed a known-bad token value into the
      # mirror and require the sync gate to reject it.
      - name: Negative control — the sync gate must reject a hand-edited mirror
        env:
          FORGE_PRODUCER_DIR: ${{ github.workspace }}/.forge-producer
        run: |
          cp src/forge/forge.css /tmp/forge.selftest.bak
          # A real token value, not a comment: the drift report is built by parsing
          # token declarations, so a commented probe would be ignored for the wrong
          # reason. Re-seed the exact defect this bead was filed for.
          sed -i 's/--g-font-size-micro: 11px/--g-font-size-micro: 10px/' src/forge/forge.css
          if node scripts/sync-forge-tokens.mjs --check > /tmp/forge-selftest.log 2>&1; then
            cp /tmp/forge.selftest.bak src/forge/forge.css
            echo "::error::NEGATIVE CONTROL FAILED — the sync gate passed a mirror whose --g-font-size-micro disagrees with the producer. This is precisely the divergence the bead was filed for; the gate is not wired. Do not trust its green."
            cat /tmp/forge-selftest.log
            exit 1
          fi
          grep -q 'font-size-micro' /tmp/forge-selftest.log || {
            cp /tmp/forge.selftest.bak src/forge/forge.css
            echo "::error::NEGATIVE CONTROL FAILED — the sync gate failed, but not on the seeded token. It is failing for some other reason and does not discriminate."
            exit 1
          }
          cp /tmp/forge.selftest.bak src/forge/forge.css
          echo "OK  sync gate correctly rejected a hand-edited mirror, naming the token"
          # Prove the restore worked, so a broken restore cannot leave the tree dirty
          # and silently pass the next step.
          node scripts/sync-forge-tokens.mjs --check

      # gy-aczn1: functions/_forge.js is GENERATED from src/forge/forge.css, because
      # the Pages Functions run in a Worker and cannot import the site's CSS. A
      # generated copy is only safe while something proves it is still a copy —
      # otherwise it is just a second hand-written palette with a comment claiming
      # otherwise. This regenerates and diffs.
      - name: Generated Functions palette is in sync with forge.css
        run: node scripts/gen-functions-forge-tokens.mjs --check

      # 🔴 SECOND NEGATIVE CONTROL, for the SECOND scan root. The one below seeds
      # src/App.tsx and proves the gate rejects drift in src/. It said nothing
      # about functions/, which is exactly how functions/ came to hold 48 exact
      # duplicates under a green check (gy-aczn1) — the gate scanned src/ and only
      # .css/.tsx/.ts, so it was blind by directory AND by extension.
      # A control that only exercises one scan root cannot detect the loss of the
      # other, so both roots get one.
      - name: Negative control — the gate must reject drift in functions/ too
        env:
          FORGE_PRODUCER_DIR: ${{ github.workspace }}/.forge-producer
        run: |
          cp 'functions/w/[token].js' /tmp/w.selftest.bak
          # Real code, NOT a comment: the gate deliberately blanks comments so it
          # cannot flag its own documentation, and a commented probe would be
          # ignored for that reason rather than for the reason under test.
          sed -i '0,/\*{box-sizing:border-box}/s//*{box-sizing:border-box}\n.forge-selftest{color:#fbbf24}/' 'functions/w/[token].js'
          if node scripts/check-forge-tokens.mjs > /tmp/selftest-fn.log 2>&1; then
            cp /tmp/w.selftest.bak 'functions/w/[token].js'
            echo "::error::NEGATIVE CONTROL FAILED — the token gate passed a Pages Function containing a known duplicate literal. functions/ is not being scanned; do not trust its green."
            cat /tmp/selftest-fn.log
            exit 1
          fi
          # 🔴 A NON-ZERO EXIT IS NOT PROOF OF A REJECTION. Found 2026-09-11 in run
          # 34564110037: a ReferenceError crashed this gate at module load, the
          # `if` below read the non-zero exit as success, and this step printed
          # "OK gate correctly rejected drift" while the gate had not evaluated a
          # single file. A control that accepts any failure cannot tell the rule
          # firing from the instrument breaking. Require the seeded literal to be
          # NAMED in the output.
          if ! grep -q 'functions/w/\[token\].js' /tmp/selftest-fn.log; then
            cp /tmp/w.selftest.bak 'functions/w/[token].js'
            echo "::error::NEGATIVE CONTROL FAILED — the gate exited non-zero but never named the seeded literal in functions/w/[token].js. It failed for some other reason (a crash counts) and does not discriminate."
            cat /tmp/selftest-fn.log
            exit 1
          fi
          cp /tmp/w.selftest.bak 'functions/w/[token].js'
          echo "OK  gate correctly rejected drift inside functions/, naming the file"
          node scripts/check-forge-tokens.mjs

      # 🔴 REGRESSION CONTROL FOR THE EXEMPTION'S SHAPE — gy-swdgh, 2026-09-12.
      # The vendored-mirror exemption was a STRING PREFIX where a PATH BOUNDARY was
      # meant (`f.startsWith(VENDORED)`, VENDORED = <root>/src/forge with no trailing
      # separator). It therefore also exempted every sibling whose name merely begins
      # with "forge" — and one existed: src/forge-ui.tsx, THE FILE THIS GATE WAS
      # WRITTEN FOR. The gate reported OK over its own founding defect for its entire
      # life, and the gy-1phkc SSOT repoint carried the bug through untouched.
      #
      # The other controls in this file cannot catch that: they all seed files
      # (src/App.tsx, functions/w/[token].js) whose paths do not collide with the
      # exemption, so they pass identically whether the boundary is right or wrong.
      # This one seeds the collision itself. src/forge.tsx is the tightest case —
      # one character from the exempt directory name.
      - name: Negative control — a path that only PREFIX-matches src/forge must still be scanned
        env:
          FORGE_PRODUCER_DIR: ${{ github.workspace }}/.forge-producer
        run: |
          # Real code, not a comment: the gate blanks comments, so a commented probe
          # would be ignored for the wrong reason.
          printf 'export const probe = "#f59e0b";\n' > src/forge.tsx
          if node scripts/check-forge-tokens.mjs > /tmp/selftest-boundary.log 2>&1; then
            rm -f src/forge.tsx
            echo "::error::NEGATIVE CONTROL FAILED — the gate passed src/forge.tsx, which contains the brand amber as a raw literal. The vendored exemption is matching a STRING PREFIX again instead of a path boundary, so every src/forge* sibling is invisible. This is the gy-swdgh regression; do not trust this green."
            cat /tmp/selftest-boundary.log
            exit 1
          fi
          # A non-zero exit is not proof of a rejection (see the note above): require
          # the seeded file to be NAMED, or a crash would read as success.
          if ! grep -q 'src/forge.tsx' /tmp/selftest-boundary.log; then
            rm -f src/forge.tsx
            echo "::error::NEGATIVE CONTROL FAILED — the gate exited non-zero but never named src/forge.tsx. It failed for some other reason (a crash counts) and does not discriminate."
            cat /tmp/selftest-boundary.log
            exit 1
          fi
          rm -f src/forge.tsx
          echo "OK  gate scans a path that only prefix-matches the exempt directory, naming the file"
          # POSITIVE CONTROL, in the same step: fixing the boundary must not have
          # broken the exemption it exists for. A literal genuinely INSIDE src/forge/
          # must still be exempt — otherwise "boundary fixed" and "exemption broken"
          # look identical from a red gate.
          node scripts/check-forge-tokens.mjs > /tmp/selftest-inside.log 2>&1
          if grep -qE '^  src/forge/' /tmp/selftest-inside.log; then
            echo "::error::The gate is now flagging the vendored mirror itself. The exemption is over-corrected — src/forge/ IS the palette and is allowed to contain literals."
            cat /tmp/selftest-inside.log
            exit 1
          fi
          echo "OK  src/forge/ is still exempt — the boundary narrowed, the exemption survived"

      # The gate must be shown capable of FAILING, in the same run that reports
      # it passing. A guard nobody has watched fail is indistinguishable from one
      # that cannot fail — which is the shape this repo already guards against in
      # gate-selftest.yml, and the reason that file exists.
      - name: Negative control — the gate must reject reintroduced drift
        env:
          FORGE_PRODUCER_DIR: ${{ github.workspace }}/.forge-producer
        run: |
          cp src/App.tsx /tmp/App.selftest.bak
          # Substitute a token's exact value back in as a raw literal.
          sed -i '0,/color: F.bone/s//color: "#f0f0eb"/' src/App.tsx
          if node scripts/check-forge-tokens.mjs > /tmp/selftest.log 2>&1; then
            cp /tmp/App.selftest.bak src/App.tsx
            echo "::error::NEGATIVE CONTROL FAILED — the token gate passed a file with a known duplicate literal. The gate is not working; do not trust its green."
            cat /tmp/selftest.log
            exit 1
          fi
          # Same hardening as the functions/ control above: prove the gate failed
          # ON THE SEEDED LITERAL, not merely that it failed.
          if ! grep -q 'src/App.tsx' /tmp/selftest.log; then
            cp /tmp/App.selftest.bak src/App.tsx
            echo "::error::NEGATIVE CONTROL FAILED — the gate exited non-zero but never named src/App.tsx. It failed for some other reason (a crash counts) and does not discriminate."
            cat /tmp/selftest.log
            exit 1
          fi
          cp /tmp/App.selftest.bak src/App.tsx
          echo "OK  gate correctly rejected reintroduced drift, naming the file"
          # And prove the restore worked, so a broken restore cannot leave the
          # tree dirty and silently pass the next step.
          node scripts/check-forge-tokens.mjs
