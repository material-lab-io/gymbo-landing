name: Prod Watch

# Hourly production watch, CURL HALF ONLY (gy-6stol / G2 of gy-gtyxh; split by gy-qgq5g, pm GO option (c), 22 Oct 2026).
# scripts/getgymbo-smoke.sh has said "run on cron against prod" in its own header since gy-kefk3 — this wires that capability up.
# No credentials. Distinct from gy-7t4sr (external off-infra uptime monitoring, founder-gated on a credential) — this runs in our
# own CI and must not wait on that.
#
# WHY prod-monitor AND NOT pool, gt2 OR gt3. gy-s8rfcl (Kaushik 31 Oct): no CI on GT2. GT3 was cancelled on 6 Nov 2026 (gy-3cerrq): a watch pinned to a runner that
# no longer exists is blind, not red. #329 moved it to the CI pool; a monitor that queues behind CI is still blind when the pool is busy, so gy-spn9yu moves it to the
# dedicated monitor runner [self-hosted, prod-monitor] (GARM set prod-monitor-gt10, repo-scoped to this repo, one VM always ready). That label is for CURL-ONLY
# monitors: scripts/check-workflow-runners.mjs refuses it for any other workflow and for any build/browse step. It stays CURL-ONLY: no npm, no Node, no Playwright, no browser. scripts/check-prod-watch-curl-only.mjs fails the PR if one is added back. The headless-Chromium console
# check is its own workflow, prod-watch-console.yml, on [self-hosted, pool].
#
# The display name and the hourly cron are a CONTRACT with the external async-watchdog (scripts/check-external-watch-contract.mjs).

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      verify_url:
        description: "Override target (negative-control testing only — leave blank for normal runs)"
        required: false
        default: ""

jobs:
  watch:
    runs-on: [self-hosted, prod-monitor]  # gy-spn9yu: the dedicated monitor runner (curl-only); gy-s8rfcl: no CI on GT2; gy-3cerrq: GT3 is gone
    steps:
      - uses: actions/checkout@v4

      - name: Run prod smoke (curl only)
        run: |
          TARGET="${{ github.event.inputs.verify_url }}"
          if [ -z "$TARGET" ]; then TARGET="https://getgymbo.com"; fi
          echo "Checking $TARGET"
          bash scripts/getgymbo-smoke.sh "$TARGET"

      # Analytics ingest chain (gy-38qovk): tracker tag on the page -> script.js served -> POST /api/send answers. Curl only, and the
      # probe uses a bot UA so Umami drops it without a database write (it never adds a pageview). It cannot see whether a real visit
      # lands a row or whether any visitor came; that passive "no events for N hours" check needs the database (gy-38qovk follow-up).
      - name: Analytics ingest chain alive (curl only)
        if: github.event.inputs.verify_url == ''
        run: bash scripts/check-analytics-ingest.sh https://getgymbo.com

      # Merged-but-not-deployed guard (gy-sa0fm AC3): the actual gy-sa0fm
      # defect was never a red check — deploy.yml simply never RAN on the
      # merge (suppressed by inherited [skip ci], or wedged on the visual
      # gate), so nothing inside that workflow could ever have caught it.
      # This runs hourly on a fresh checkout of main (the schedule trigger's
      # default ref) and compares that HEAD against what the live site's
      # deploy.yml build step actually stamped into dist/build-sha.txt
      # (see deploy.yml "Stamp build SHA"). A mismatch means a commit landed
      # on main that the live site has never served — exactly the silent gap
      # that got worked around twice with manual trigger commits on
      # 2026-08-11 instead of being visible. Skipped on a manual verify_url
      # override (negative-control testing) since that target won't carry
      # our build-sha.txt.
      - name: Verify live deploy matches main HEAD
        if: github.event.inputs.verify_url == ''
        # gy-y2ci1: a mismatch is classified by what the deploy run FOR THIS HEAD is doing (in flight = PENDING,
        # bounded; failed / never ran / succeeded-but-stale = FAIL). Logic and its tests live in
        # scripts/check-deploy-matches-head.mjs + tests/prod-watch-inflight.test.mjs. The token only lists
        # workflow runs (the repo is public; it is here to avoid the anonymous API rate limit).
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-deploy-matches-head.mjs
