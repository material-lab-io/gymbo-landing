name: Prod Watch

# Scheduled regression against the LIVE domain (gy-6stol / G2 of gy-gtyxh).
# scripts/getgymbo-smoke.sh has said "run on cron against prod" in its own
# header since gy-kefk3 — this wires that capability up. Dependency-light
# (curl-only smoke script + the existing console-check.mjs), no credentials.
# Distinct from gy-7t4sr (external off-infra uptime monitoring, founder-gated
# on a credential) — this runs in our own CI and must not wait on that.

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      verify_url:
        description: "Override target (negative-control testing only — leave blank for normal runs)"
        required: false
        default: ""

jobs:
  watch:
    runs-on: [self-hosted, gt2]
    steps:
      - uses: actions/checkout@v4

      # No `cache: npm`: on the persistent gt2 runners this step cost a median
      # 369s (prod-watch, 20/20 runs over 5.7 min) while `npm ci` takes ~7-11s
      # and got FASTER without it (run 34011955222 vs 34010364422). ~/.npm is
      # already warm on local disk, so the Actions cache was restoring a cache
      # on top of a cache over the network. See gy-2vvun. Do not re-add.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      # --with-deps dropped deliberately: it shells out to apt-get and needs
      # root, which a self-hosted runner does not grant. The gt2 runners
      # already carry the Playwright system libraries and a warm
      # ~/.cache/ms-playwright, so this resolves from cache. Do NOT re-add
      # --with-deps when moving a job to self-hosted.
      - name: Install Chromium (console check)
        run: npx playwright install chromium

      - name: Run prod regression
        run: |
          TARGET="${{ github.event.inputs.verify_url }}"
          if [ -z "$TARGET" ]; then TARGET="https://getgymbo.com"; fi
          echo "Checking $TARGET"
          bash scripts/getgymbo-smoke.sh "$TARGET"
          node scripts/console-check.mjs "$TARGET"

      # Merged-but-not-deployed guard (gy-sa0fm AC3): the actual gy-sa0fm
      # defect was never a red check — deploy.yml simply never RAN on the
      # merge (suppressed by inherited [skip ci], or wedged on the visual
      # gate), so nothing inside that workflow could ever have caught it.
      # This runs hourly on a fresh checkout of main (the schedule trigger's
      # default ref) and compares that HEAD against what the live site's
      # deploy.yml build step actually stamped into dist/build-sha.txt
      # (see deploy.yml "Stamp build SHA"). A mismatch means a commit landed
      # on main that the live site has never served — exactly the silent gap
      # that got worked around twice with manual trigger commits on
      # 2026-08-11 instead of being visible. Skipped on a manual verify_url
      # override (negative-control testing) since that target won't carry
      # our build-sha.txt.
      - name: Verify live deploy matches main HEAD
        if: github.event.inputs.verify_url == ''
        run: |
          head_sha=$(git rev-parse HEAD)
          live_sha=$(curl -sf --max-time 10 https://getgymbo.com/build-sha.txt || echo "")
          echo "main HEAD:        $head_sha"
          echo "live build-sha:   $live_sha"
          if [ -z "$live_sha" ]; then
            echo "::error::Could not fetch https://getgymbo.com/build-sha.txt at all — either the guard itself hasn't deployed yet, or the site is down (getgymbo-smoke.sh above should already have caught the latter)."
            exit 1
          fi
          if [ "$live_sha" != "$head_sha" ]; then
            echo "::error::Live site is serving $live_sha but main's HEAD is $head_sha — a merge to main has not reached production. Check whether deploy.yml actually ran on the merge commit (gh run list --branch main) before assuming a fresh push is needed."
            exit 1
          fi
          echo "OK   live site matches main HEAD"
