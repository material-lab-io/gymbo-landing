name: Gate Self-Test (negative controls)

# gy-ruxbj (G3 of gy-gtyxh): "a gate never seen to fail is not a gate."
# getgymbo-smoke.sh, console-check.mjs, and check-screenshot-freshness.mjs
# have blocked deploys since they were written, but were never proven to
# actually fail on bad input — only the visual-baseline diff has ever gone
# red. This workflow feeds each gate a fixture that VIOLATES its rule and
# fails the job if the gate PASSES anyway (inverted exit code). Fixtures are
# served from a temp dir via a throwaway local HTTP server — production is
# never touched (AC3).
#
# If a future gate is added to deploy.yml without a matching negative
# control here, that is incomplete work and must be called out in the PR
# description (AC4).

on:
  pull_request:
    paths:
      - "scripts/**"
      - ".github/workflows/**"
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC
  workflow_dispatch:

jobs:
  negative-controls:
    runs-on: [self-hosted, gt2]
    steps:
      - uses: actions/checkout@v4

      - name: Approved self-hosted runner guard
        run: node scripts/check-workflow-runners.mjs

      # No `cache: npm`: on the persistent gt2 runners this step cost a median
      # 369s (prod-watch, 20/20 runs over 5.7 min) while `npm ci` takes ~7-11s
      # and got FASTER without it (run 34011955222 vs 34010364422). ~/.npm is
      # already warm on local disk, so the Actions cache was restoring a cache
      # on top of a cache over the network. See gy-2vvun. Do not re-add.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Negative control — runner guard must FAIL on GitHub-hosted labels
        run: |
          set -e
          FIX=$(mktemp -d)
          printf '%s\n' 'name: Hosted runner regression' 'jobs:' '  hosted:' '    runs-on: ubuntu-latest' > "$FIX/hosted.yml"
          if node scripts/check-workflow-runners.mjs "$FIX"; then
            echo "::error::Runner guard PASSED on ubuntu-latest — hosted runners can consume billed minutes."
            exit 1
          fi
          echo "OK: runner guard correctly rejected ubuntu-latest."

      - name: Negative control — runner guard must FAIL on any unapproved label
        run: |
          set -e
          FIX=$(mktemp -d)
          printf '%s\n' 'name: Unapproved runner regression' 'jobs:' '  hosted:' '    runs-on: windows-latest' > "$FIX/unapproved.yml"
          if node scripts/check-workflow-runners.mjs "$FIX"; then
            echo "::error::Runner guard PASSED on windows-latest — an unapproved GitHub-hosted label slipped through."
            exit 1
          fi
          echo "OK: runner guard correctly rejected windows-latest."

      # --with-deps dropped deliberately: it shells out to apt-get and needs
      # root, which a self-hosted runner does not grant. The gt2 runners
      # already carry the Playwright system libraries and a warm
      # ~/.cache/ms-playwright, so this resolves from cache. Do NOT re-add
      # --with-deps when moving a job to self-hosted.
      - name: Install Chromium (console-check negative controls)
        run: npx playwright install chromium

      - name: Sanity — the GOOD fixture must PASS both curl gates
        run: |
          set -e
          FIX=$(mktemp -d)
          bash scripts/build-fixture-site.sh "$FIX" good
          python3 -m http.server 8901 --directory "$FIX" &
          SRV=$!
          sleep 1
          trap 'kill $SRV 2>/dev/null || true' EXIT
          if ! CONTRACT=/dev/null bash scripts/getgymbo-smoke.sh http://127.0.0.1:8901; then
            echo "::error::getgymbo-smoke.sh FAILED on the well-formed baseline fixture — a fixture bug, not a real regression. Fix the fixture before trusting any negative control below."
            exit 1
          fi
          echo "OK: baseline fixture passes cleanly (negative controls below are meaningful)."

      - name: Negative control — getgymbo-smoke.sh must FAIL on missing <title>
        run: |
          set -e
          FIX=$(mktemp -d)
          bash scripts/build-fixture-site.sh "$FIX" no-title
          python3 -m http.server 8902 --directory "$FIX" &
          SRV=$!; sleep 1; trap 'kill $SRV 2>/dev/null || true' EXIT
          if CONTRACT=/dev/null bash scripts/getgymbo-smoke.sh http://127.0.0.1:8902; then
            echo "::error::getgymbo-smoke.sh PASSED on a fixture with no <title> — the gate is not wired."
            exit 1
          fi
          echo "OK: getgymbo-smoke.sh correctly failed on a missing <title>."

      - name: Negative control — getgymbo-smoke.sh must FAIL on missing pricing (₹399)
        run: |
          set -e
          FIX=$(mktemp -d)
          bash scripts/build-fixture-site.sh "$FIX" missing-pricing
          python3 -m http.server 8903 --directory "$FIX" &
          SRV=$!; sleep 1; trap 'kill $SRV 2>/dev/null || true' EXIT
          if CONTRACT=/dev/null bash scripts/getgymbo-smoke.sh http://127.0.0.1:8903; then
            echo "::error::getgymbo-smoke.sh PASSED on a fixture missing ₹399 — the gate is not wired."
            exit 1
          fi
          echo "OK: getgymbo-smoke.sh correctly failed on missing ₹399."

      - name: Negative control — getgymbo-smoke.sh must FAIL when ClaudeBot is Disallowed
        run: |
          set -e
          FIX=$(mktemp -d)
          bash scripts/build-fixture-site.sh "$FIX" robots-disallow-claudebot
          python3 -m http.server 8904 --directory "$FIX" &
          SRV=$!; sleep 1; trap 'kill $SRV 2>/dev/null || true' EXIT
          if CONTRACT=/dev/null bash scripts/getgymbo-smoke.sh http://127.0.0.1:8904; then
            echo "::error::getgymbo-smoke.sh PASSED on a robots.txt that Disallows ClaudeBot — the AI-crawler regression gate is not wired."
            exit 1
          fi
          echo "OK: getgymbo-smoke.sh correctly failed on a ClaudeBot Disallow."

      - name: Negative control — getgymbo-smoke.sh must FAIL on a contract/site price mismatch
        run: |
          set -e
          FIX=$(mktemp -d)
          bash scripts/build-fixture-site.sh "$FIX" good
          BAD_CONTRACT="$FIX/bad-product-contract.json"
          cat > "$BAD_CONTRACT" <<'JSON'
          { "pricing": { "monthly_inr": "999", "annual_inr_display": "9,999", "annual_savings_percent": "12" } }
          JSON
          python3 -m http.server 8905 --directory "$FIX" &
          SRV=$!; sleep 1; trap 'kill $SRV 2>/dev/null || true' EXIT
          if CONTRACT="$BAD_CONTRACT" bash scripts/getgymbo-smoke.sh http://127.0.0.1:8905; then
            echo "::error::getgymbo-smoke.sh PASSED against a contract that doesn't match the rendered price — G4's contract assertion is not wired."
            exit 1
          fi
          echo "OK: getgymbo-smoke.sh correctly failed on a contract/site price mismatch."

      - name: Negative control — theme invariant must FAIL if dark-mode leaks back in (data-theme, static)
        run: |
          set -e
          FIX=$(mktemp -d)
          bash scripts/build-fixture-site.sh "$FIX" dark-theme-leak
          # Force the static assertion by shipping data-theme="dark" in the raw HTML too.
          sed -i 's/<body>/<body data-theme="dark">/' "$FIX/index.html"
          cp "$FIX/index.html" "$FIX/privacy"
          cp "$FIX/index.html" "$FIX/terms"
          python3 -m http.server 8906 --directory "$FIX" &
          SRV=$!; sleep 1; trap 'kill $SRV 2>/dev/null || true' EXIT
          if CONTRACT=/dev/null bash scripts/getgymbo-smoke.sh http://127.0.0.1:8906; then
            echo "::error::getgymbo-smoke.sh PASSED on HTML shipping data-theme=\"dark\" — the light-only static gate (gy-uesmd regression) is not wired."
            exit 1
          fi
          echo "OK: getgymbo-smoke.sh correctly failed on baked-in data-theme=dark."

      - name: Negative control — console-check.mjs must FAIL when a page throws a JS error
        run: |
          set -e
          FIX=$(mktemp -d)
          bash scripts/build-fixture-site.sh "$FIX" js-error
          python3 -m http.server 8907 --directory "$FIX" &
          SRV=$!; sleep 1; trap 'kill $SRV 2>/dev/null || true' EXIT
          if node scripts/console-check.mjs http://127.0.0.1:8907; then
            echo "::error::console-check.mjs PASSED on a page that throws a JS error — the console-error gate is not wired."
            exit 1
          fi
          echo "OK: console-check.mjs correctly failed on a page that throws."

      - name: Negative control — console-check.mjs must FAIL when dark leaks back in under a seeded localStorage
        run: |
          set -e
          FIX=$(mktemp -d)
          bash scripts/build-fixture-site.sh "$FIX" dark-theme-leak
          python3 -m http.server 8908 --directory "$FIX" &
          SRV=$!; sleep 1; trap 'kill $SRV 2>/dev/null || true' EXIT
          if node scripts/console-check.mjs http://127.0.0.1:8908; then
            echo "::error::console-check.mjs PASSED on a fixture that flips dark under localStorage theme=dark — the dark-seed invariant (the incident that actually shipped) is not wired."
            exit 1
          fi
          echo "OK: console-check.mjs correctly failed under a seeded-dark localStorage."

      # ── Screenshot gate: the gy-7anl3 SPLIT, proved in both directions ──────
      # The gate stopped being one verdict on 2026-09-06. AC3 of gy-7anl3 asks
      # for a named control showing, in the same run: with masters stale, the
      # screenshot PUBLISH refused, the site deploy NOT blocked, and the
      # staleness still reported somewhere a human sees — and with masters
      # fresh, all three clean. These six steps are that control.
      #
      # The fixture builds a manifest from the real SCREENS map, so adding a
      # screenshot to the site cannot silently fall outside these controls.
      - name: Build screenshot-gate fixtures (real SCREENS map, controlled ages)
        run: |
          set -euo pipefail
          FIX=$RUNNER_TEMP/screenshot-gate-fixture
          rm -rf "$FIX"; mkdir -p "$FIX/scripts" "$FIX/public/screens"
          cp scripts/check-screenshot-freshness.mjs scripts/screens-map.mjs "$FIX/scripts/"
          node -e '
            const fs = require("node:fs");
            const path = require("node:path");
            const fix = process.env.RUNNER_TEMP + "/screenshot-gate-fixture";
            import("./scripts/screens-map.mjs").then(({ SCREENS }) => {
              const files = Object.values(SCREENS);
              const at = (d) => new Date(Date.now() - d * 86400e3).toISOString();
              const build = (days) => ({ maxAgeDays: 21, entries:
                Object.fromEntries(files.map((f) => [f, { capturedAt: at(days), verified: true }])) });
              fs.writeFileSync(path.join(fix, "stale.json"), JSON.stringify(build(400), null, 2));
              fs.writeFileSync(path.join(fix, "fresh.json"), JSON.stringify(build(2), null, 2));
              fs.writeFileSync(path.join(fix, "one-stale.txt"), "public/screens/" + files[0] + "\n");
              fs.writeFileSync(path.join(fix, "unrelated.txt"), "src/pages/privacy.astro\n");
              console.log("fixtures built for " + files.length + " gated screenshot(s)");
            });
          '
          echo "FIX=$FIX" >> "$GITHUB_ENV"

      - name: Negative control — publish of a STALE master must be REFUSED
        run: |
          set -euo pipefail
          cp "$FIX/stale.json" "$FIX/public/screens/manifest.json"
          cd "$FIX"
          if node scripts/check-screenshot-freshness.mjs --changed "$FIX/one-stale.txt"; then
            echo "::error::The gate PASSED a change that publishes a 400d-old master. gy-7anl3's blocking half is gone — stale art can now be shipped as new."
            exit 1
          fi
          echo "OK: publishing a stale master is refused."

      - name: Negative control — a manifest EDIT must also count as publishing
        run: |
          set -euo pipefail
          cd "$FIX"
          printf 'public/screens/manifest.json\n' > "$FIX/manifest-edit.txt"
          if node scripts/check-screenshot-freshness.mjs --changed "$FIX/manifest-edit.txt"; then
            echo "::error::The gate PASSED a manifest.json edit with stale entries — an author could restate a stale capture as current."
            exit 1
          fi
          echo "OK: a manifest edit is treated as publishing every entry."

      - name: Negative control — an UNREADABLE change set must not read as clean
        run: |
          set -euo pipefail
          cd "$FIX"
          if node scripts/check-screenshot-freshness.mjs --changed "$FIX/does-not-exist.txt"; then
            echo "::error::The gate PASSED with an unreadable change set — a could-not-look is rendering as a look-that-passed, which downgrades every stale master to a warning."
            exit 1
          fi
          echo "OK: an unreadable change set is a could-not-look, not a pass."

      - name: Negative control — --strict must still block EVERYTHING stale
        run: |
          set -euo pipefail
          cd "$FIX"
          if node scripts/check-screenshot-freshness.mjs --strict; then
            echo "::error::--strict PASSED on 400d-old masters. The escape hatch that restores the pre-gy-7anl3 behaviour does not work, so the split cannot be revoked in one word as documented."
            exit 1
          fi
          echo "OK: --strict still blocks on age alone."

      - name: Control — stale but UNTOUCHED must NOT block, and must still be LOUD
        run: |
          set -euo pipefail
          cd "$FIX"
          SUMMARY=$RUNNER_TEMP/gate-summary.md
          : > "$SUMMARY"
          # This is the deploy-not-blocked half of gy-7anl3 AC3. Asserting the
          # exit code alone would let the alarm be deleted silently, which is
          # exactly the 08-12 fail-open — so the annotation and the summary are
          # asserted too.
          if ! GITHUB_STEP_SUMMARY="$SUMMARY" node scripts/check-screenshot-freshness.mjs \
               --changed "$FIX/unrelated.txt" > "$RUNNER_TEMP/gate-out.txt" 2>&1; then
            cat "$RUNNER_TEMP/gate-out.txt"
            echo "::error::The gate BLOCKED a change that touches no gated screenshot. gy-7anl3 has regressed: marketing art is again holding the whole public site, including emergency legal copy."
            exit 1
          fi
          grep -q '^::warning file=public/screens/' "$RUNNER_TEMP/gate-out.txt" || {
            cat "$RUNNER_TEMP/gate-out.txt"
            echo "::error::Stale masters shipped with NO ::warning annotation. Moving the gate deleted the alarm — that is the 08-12 fail-open repeating."; exit 1; }
          grep -q 'stale master' "$SUMMARY" || {
            cat "$SUMMARY"
            echo "::error::Stale masters shipped with nothing in the job summary. AC2 requires the staleness to reach somewhere a human triaging the deploy is standing."; exit 1; }
          echo "OK: deploy not blocked, and the staleness is reported in BOTH the annotation and the job summary."

      - name: Control — with masters FRESH, all three are clean
        run: |
          set -euo pipefail
          cp "$FIX/fresh.json" "$FIX/public/screens/manifest.json"
          cd "$FIX"
          SUMMARY=$RUNNER_TEMP/gate-summary-fresh.md
          : > "$SUMMARY"
          GITHUB_STEP_SUMMARY="$SUMMARY" node scripts/check-screenshot-freshness.mjs \
            --changed "$FIX/one-stale.txt" > "$RUNNER_TEMP/gate-fresh.txt" 2>&1
          if grep -q '^::warning file=public/screens/' "$RUNNER_TEMP/gate-fresh.txt"; then
            cat "$RUNNER_TEMP/gate-fresh.txt"
            echo "::error::Fresh masters produced a staleness warning — the gate cries wolf, and an alarm that fires when nothing is wrong stops being read."
            exit 1
          fi
          node scripts/check-screenshot-freshness.mjs --strict > /dev/null
          echo "OK: fresh masters — publish allowed, deploy allowed, no false alarm, and --strict agrees."

      - name: Photoreal-device gate self-test
        run: node scripts/check-photoreal-device.selftest.mjs

      - name: All negative controls fired correctly
        run: echo "Every gate above correctly rejected a fixture that violates its rule."
