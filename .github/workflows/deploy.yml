name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      verify_url:
        description: "Override target for the post-deploy live check (negative-control testing only — leave blank for normal runs)"
        required: false
        default: ""

# Serializes every run of THIS workflow on the gt2 host (gy-5e9u6) so two main
# deploys never race the actual `wrangler pages deploy`. cancel-in-progress is
# deliberately false — queue runs, never cancel an in-flight main deploy.
#
# 🔴 THE GROUP IS KEYED PER-REF (gy-vewd8). It used to be the constant
# "gymbo-landing-deploy", which made it REPO-WIDE: every branch competed in one
# queue. cancel-in-progress:false protects a RUNNING run, but GitHub keeps only
# the newest PENDING run per group and cancels the rest — across branches. So a
# push on any branch silently cancelled another PR's `deploy`, which is the SOLE
# required context on main. A cancelled required check is worse than a red: it
# has no failing step to read, it is ABSENT from the PR's check rollup rather
# than failing in it, and nothing ever re-runs it. Measured 2026-09-06: PR #109's
# run 34012197921 (head 38966ecd) was created 04:42:50Z and cancelled 04:45:10Z
# with ZERO JOBS — evicted while pending by a run created 04:45:09Z on an
# unrelated branch. Last 60 Deploy runs: 33 success, 16 failure, 11 CANCELLED;
# 8 cancellations across 5 branches in one 34-minute window on 08-31.
# Per-ref preserves the invariant this group was written for exactly: main is
# still serialized against itself, and a PR run publishes nothing anyway (the
# deploy step below is `if: github.ref == 'refs/heads/main'`).
# Do NOT re-flatten this to a constant, and do NOT "fix" a queue wait by setting
# cancel-in-progress — the main-deploy race (gy-5e9u6) is real.
#
# NOTE (gy-cjdtw): this does NOT prevent the smoke-gate port race, because that
# collision was cross-workflow (a deploy's Playwright preview vs a concurrent
# refresh-visual-baselines run, both on a fixed :4173). The gate below now binds
# per-run FREE ports for both the Pages emulator and the preview, which removes
# the race regardless of concurrency.
concurrency:
  group: gymbo-landing-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, gt2]
    steps:
      # fetch-depth: 0 (gy-7anl3) — the screenshot gate needs to know which
      # artifacts THIS change touches, and a depth-1 clone cannot answer that.
      # The gate exits 1 rather than guessing, so a shallow clone here would
      # block every deploy instead of silently downgrading. Small repo; cheap.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Approved self-hosted runner guard
        run: node scripts/check-workflow-runners.mjs

      # No `cache: npm`: on the persistent gt2 runners this step cost a median
      # 369s (prod-watch, 20/20 runs over 5.7 min) while `npm ci` takes ~7-11s
      # and got FASTER without it (run 34011955222 vs 34010364422). ~/.npm is
      # already warm on local disk, so the Actions cache was restoring a cache
      # on top of a cache over the network. See gy-2vvun. Do not re-add.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      # Fast typecheck, deliberately the FIRST thing after install (gy-nqryp).
      #
      # WHY IT EXISTS: three times on 2026-09-07 a malformed JSX block comment
      # (an unclosed `{/*`) reached CI and killed this job at `npm run build`.
      # `tsc` is the third command inside that build, behind optimize-gallery
      # and after every gate below, so a one-character syntax error was costing
      # a full runner slot on a saturated 3-runner pool to report something
      # `tsc` answers in ~1.4s.
      #
      # WHY A STEP AND NOT A SEPARATE JOB: a job would claim a SECOND runner
      # slot on every push, which is the same resource gy-2vvun just spent
      # 17 hrs/week reclaiming. A step costs seconds and no extra slot, and
      # still satisfies "fails before the expensive gates".
      #
      # It runs the SAME `tsc -b` the build runs, so it cannot drift from what
      # the build enforces. Locally: `npm run typecheck` (~1.4s) before any
      # push touching src/**, and read the exit code DIRECTLY, never through a
      # pipe — `| tail` reports tail's status and a failed build reads green.
      - name: Typecheck (fails fast, before the expensive gates)
        run: npm run typecheck

      # gy-a2xps.9 — the public media surface. Both steps are STATIC (no network,
      # no database, no browser), so they run before the build and fail in
      # seconds rather than after it.
      - name: "gy-a2xps.9: Forge token drift on the media pages"
        run: node scripts/check-forge-token-drift.mjs
        # functions/m/*.js inline their design tokens because a Pages Function
        # cannot import the hashed Vite bundle. That second copy is CHECKED here
        # against src/forge/forge.css, so drift is a red test rather than a public
        # page that quietly stops looking like Gymbo. The script carries its own
        # positive control and exits 2 if it cannot read forge.css at all —
        # a zero it cannot substantiate is a failure, not a pass.

      - name: "gy-0v33y: the lead-source rule is bounded and never guesses"
        run: node --test tests/attribution-source.test.mjs
        # AC5/AC7. public.waitlist.source carried DEFAULT 'getgymbo.com' and was
        # never written, so every row claimed the website — including the
        # Instagram ones. The risk in fixing that is not an empty column, it is
        # a CONFIDENT WRONG one, so most of these controls assert on NULL and
        # two positive controls prove the rule can still return a channel at
        # all. Mutation-checked three ways (drop the placeholder guard, store
        # the referrer host instead of the engine slug, add a "direct"
        # fallback); each is caught.

      - name: "gy-a2xps.9 / gy-t9mm8: media + client pages render attribution and fail closed"
        run: node --test tests/media-page.test.mjs tests/client-workout.test.mjs tests/health-probe.test.mjs
        # AC1/AC2/AC3/AC5/AC7. Proves the page RENDERS a complete credit from
        # stored fields, and REFUSES to render media when provenance is missing
        # or the asset is withdrawn — a CC-BY-SA clip published without its
        # credit is a licence breach, so fail-closed is the load-bearing case.
        # Mutation-tested 2026-09-09: forcing attributionIsComplete() true turns
        # 2 red, removing the availability check turns 1 red, restoring is green.

      # Screenshot staleness gate (gy-a73px.15; placement corrected by gy-7anl3).
      #
      # WHAT IT GATES — and ONLY this: the marketing screenshot masters under
      # public/screens/ that the gallery composites, i.e. the SCREENS map in
      # scripts/screens-map.mjs. Not the site's code, copy, routes, legal or
      # privacy pages, or any other asset.
      #
      # gy-7anl3: this step lives in `deploy`, which is the SOLE required check
      # on main, so until 2026-09-06 a question about marketing art also decided
      # whether ANY change could reach a live public site — including an
      # emergency legal or privacy correction. On 2026-09-06 that pinned
      # getgymbo.com to the 2026-08-31 build with no path to publish, because
      # the staleness input is WALL CLOCK: monotonic, so no re-run can ever go
      # green (gy-fs7pe).
      #
      # It now blocks on what the AUTHOR can act on and warns on what they
      # cannot:
      #   BLOCKS  integrity — missing manifest entry, unverified, invalid
      #           capturedAt. Deterministic, a property of the change.
      #   BLOCKS  a stale master THIS CHANGE PUBLISHES (touches the PNG, or
      #           edits manifest.json). You may not ship or re-ship stale art.
      #   WARNS   a master that was already live and has merely aged. Annotation
      #           + job summary on every run — moving a gate must not delete an
      #           alarm, and this one was already silently fail-open 08-12 to
      #           08-19 (see public/screens/MANIFEST.md).
      #
      # Do NOT re-flatten this by raising maxAgeDays, adding a bypass flag, or
      # backfilling manifest entries — pm ruled all three out. The staleness is
      # REAL; recapture is gy-iit8q. If the split ever needs revoking, the
      # script still has --strict, which restores the old block-on-everything
      # behaviour in one word.
      - name: Compute the change set the screenshot gate reasons about
        run: |
          set -euo pipefail
          # Fails the step if git cannot answer. The gate itself exits 1 on an
          # unreadable change set, so neither half can silently degrade to
          # "this change touched nothing" — which would downgrade every stale
          # master to a warning and re-open the hole this gate exists to close.
          # NOTE: no --depth flag. checkout above already uses fetch-depth: 0,
          # so the history is complete. `git fetch --depth=0` is not "no limit",
          # it is an ERROR ("fatal: depth 0 is not a positive number") — it
          # failed this step on run 34039827259 and skipped the nine gates
          # behind it, which is the exact pathology this bead is about.
          # Diff against FETCH_HEAD rather than origin/<base>: on a
          # pull_request checkout the remote-tracking ref is not guaranteed to
          # exist, and a missing ref would fail here rather than mis-report.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            git diff --name-only FETCH_HEAD...HEAD > /tmp/changed-files.txt
          else
            git diff --name-only HEAD^ HEAD > /tmp/changed-files.txt
          fi
          echo "change set ($(wc -l < /tmp/changed-files.txt) path(s)):"
          sed 's/^/  /' /tmp/changed-files.txt

      - name: Screenshot staleness gate
        run: node scripts/check-screenshot-freshness.mjs --changed /tmp/changed-files.txt

      # Photoreal-device gate (gy-dyu6r.9): exact corrected hero identity, all
      # four demo/poster pairs, measured gallery mask geometry, and approved
      # self-hosted runner policy. Runs before build for authored source and
      # after build for the public assets Vite copies into dist/.
      - name: Photoreal-device gate (source)
        run: node scripts/check-photoreal-device.mjs

      - run: npm run build

      # gy-a2xps.9 — runs AFTER the build because it scans the built bundle, and
      # BEFORE the deploy because its whole job is to stop one.
      - name: "gy-a2xps.9: no server credential in the built bundle"
        run: node scripts/check-no-service-key-in-bundle.mjs
        # The public media page reads exercise_media with the service_role key,
        # which bypasses RLS on every table. That is safe ONLY because the key
        # lives in a Pages Function and is never bundled — an invariant that is
        # invisible in review and catastrophic to lose (rotate-everything, not
        # fix-forward). Leads with a positive control and exits 2 if it cannot
        # find a known string in dist/, because an empty or unbuilt dist reports
        # the same reassuring zero as a clean one.
        # Mutation-tested 2026-09-09: planting the var name in dist/ exits 1.

      - name: Photoreal-device gate (built output)
        run: node scripts/check-photoreal-device.mjs --dist

      # Deploy-SHA guard (gy-sa0fm AC3): "merged but not deployed" was
      # invisible until someone manually curled the site — that is exactly
      # how [skip ci] inheritance and the visual gate silently suppressed
      # production deploys twice on 2026-08-11. Stamping the commit SHA into
      # the served build turns a silent gap into a comparable fact: Prod
      # Watch (prod-watch.yml) checks this against origin/main's HEAD every
      # hour and fails loudly on a mismatch, instead of nobody noticing
      # until the next design review.
      - name: Stamp build SHA
        run: echo "${{ github.sha }}" > dist/build-sha.txt

      - name: Vendored contract freshness (gy-csrt8.1, G4 AC2)
        run: bash scripts/assert-contract-fresh.sh product-contract.json
        env:
          GYMBO_V1_PAT: ${{ secrets.GYMBO_V1_PAT }}

      # --with-deps dropped deliberately: it shells out to apt-get and needs
      # root, which a self-hosted runner does not grant. The gt2 runners
      # already carry the Playwright system libraries and a warm
      # ~/.cache/ms-playwright, so this resolves from cache. Do NOT re-add
      # --with-deps when moving a job to self-hosted.
      - name: Install Chromium (smoke-gate console check)
        run: npx playwright install chromium

      # Pre-deploy smoke gate (gy-kefk3): serve the freshly-built dist via the
      # Cloudflare Pages emulator and (1) assert homepage rendered (SSG didn't
      # break) + key content/og + robots AI-bot regression + /privacy + /terms
      # live (curl smoke), (2) load every route in a headless browser and fail
      # on our JS/console errors (hydration etc.), and (3) run the Playwright
      # visual-regression baselines (gy-a73px.1 / gy-a73px.13) against the same
      # emulator — a PR that changes rendering with no snapshot update fails
      # here. Non-zero exit fails the job → the deploy step below is skipped.
      # Blocks bad builds from going live.
      # gy-t9mm8 AC5 — the ONE client journey, in a real browser, against the
      # Cloudflare Pages EMULATOR (functions/ do not run under `vite preview`).
      # Runs after Chromium is installed and before the deploy, so a broken
      # client page stops the release rather than being found by a client.
      - name: "gy-t9mm8: client workout journey (real browser, no login)"
        run: ./scripts/run-client-journey.sh
        # Opens the link in a FRESH context with no storage — "no login required"
        # is only proven from a device that has never seen Gymbo. Asserts the
        # video actually DECODED A FRAME (currentTime > 0, not merely present in
        # the DOM), and asserts the tick-off AFTER A RELOAD so it can only pass
        # if the write really happened.
        # Mutation-tested 2026-09-09: a mock that returns 201 but drops the write
        # FAILS this journey (the exact "test passes without the feature" defect
        # the bead names as its anti-goal); 404ing the video bytes also fails it.

      - name: Pre-deploy smoke gate
        run: |
          # gy-cjdtw: per-run free ports so concurrent jobs on the shared
          # [self-hosted, gt2] host never collide on a FIXED :8788 (Pages
          # emulator) or :4173 (Playwright preview). A fixed-port collision
          # surfaced as 'localhost:4173 already used' and 'Pages emulator never
          # became ready' -> a degraded/racey render (e.g. hero 650px vs 679px).
          freeport() { node -e 'const s=require("net").createServer();s.listen(0,"127.0.0.1",()=>{process.stdout.write(String(s.address().port));s.close()})'; }
          WPORT=$(freeport)
          export PW_PORT=$(freeport)   # Playwright's own preview server; playwright.config reads PW_PORT
          BASE="http://127.0.0.1:$WPORT"

          npx wrangler pages dev dist --port "$WPORT" --ip 127.0.0.1 > /tmp/pagesdev.log 2>&1 &
          PD=$!
          trap 'kill $PD 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null "$BASE/"; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            echo "::error::Pages emulator never became ready on $BASE"; cat /tmp/pagesdev.log
            exit 1
          fi
          RC=0
          # Correctness gates — these BLOCK everywhere, including main. A broken
          # page or a console error must never reach production.
          bash scripts/getgymbo-smoke.sh "$BASE" || RC=1
          node scripts/console-check.mjs "$BASE" || RC=1

          # gy-9ggf3 — every choice on the takedown form must be READABLE, not
          # merely present. The Reason <select> clipped its longest option ("It
          # shows me and I did not agree to this use" — the one an actual
          # rightsholder picks) while every DOM assertion passed: the option was
          # in the markup and the select existed, and a natively-clipped select
          # reports scrollWidth === clientWidth, so the browser does not tell you
          # either. This measures the text in the control's own font against the
          # padded box.
          #
          # 390 is the iPhone-class width the defect was found at; 320 is the
          # narrowest phone still in real use, and a control that fits at 390 can
          # still clip at 320 — checking one width would rebuild the same blind
          # spot one size down.
          #
          # The script exits 2 (not 0) if it finds nothing to measure, so a page
          # that changes shape underneath it fails rather than passing silently.
          node scripts/check-option-text-fits.mjs "$BASE/m/takedown" 390 || RC=1
          node scripts/check-option-text-fits.mjs "$BASE/m/takedown" 320 || RC=1

          # Visual regression is CHANGE DETECTION, not a correctness check: it
          # fails by design whenever a design change is intentional, until the
          # baselines are refreshed. Blocking production on it is what wedged
          # deploys on 2026-08-11 (five merges, five failed deploys, all on
          # hero-light.png as the diff grew 3,632px -> 49,701px).
          #
          # So: BLOCK on pull_request, where the question "did you mean to change
          # this?" is useful and the author can still act on it. WARN on main,
          # where the change has already been reviewed and merged and the only
          # thing blocking achieves is an undeployed site plus a manual rescue
          # commit. Refresh baselines via refresh-visual-baselines.yml.
          #
          # The visual test runs against Playwright's OWN preview server
          # (playwright.config webServer, on $PW_PORT) — the same server type the
          # refresh workflow uses to GENERATE baselines — NOT this wrangler
          # emulator, so gate and baselines stay consistent.
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            npx playwright test tests/visual.spec.ts --project=desktop --project=mobile \
              || echo "::warning::Visual baselines are stale on main — deploy proceeding. Run refresh-visual-baselines.yml to resync."
          else
            npx playwright test tests/visual.spec.ts --project=desktop --project=mobile || RC=1
          fi
          exit $RC

      - name: Upload visual regression report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      - name: Deploy to Cloudflare Pages
        if: github.ref == 'refs/heads/main'
        run: npx wrangler pages deploy dist --project-name gymbo-landing --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Post-deploy live verification (gy-7fuot / G1 of gy-gtyxh): every gate
      # above runs against the wrangler emulator on a fresh dist — after this
      # point NOTHING checks the real domain. Green CI + a wrong live site was
      # unobservable. Reuses the same two scripts as the pre-deploy gate,
      # pointed at the real domain instead of 127.0.0.1. Runs AFTER the deploy
      # step, so it can never block the deploy itself — it only turns the run
      # red so a bad live site is visible and alertable (AC3). `verify_url`
      # exists solely so this step can be manually pointed at a wrong URL to
      # prove it fails (AC2) — normal push-triggered runs never set it.
      - name: Post-deploy live verification
        if: github.ref == 'refs/heads/main'
        run: |
          TARGET="${{ github.event.inputs.verify_url }}"
          if [ -z "$TARGET" ]; then TARGET="https://getgymbo.com"; fi
          echo "Verifying live deploy at $TARGET"

          # Bounded poll (~90s) for the target to be reachable at all before
          # running the real checks — do NOT sleep a fixed amount and hope.
          ready=0
          for i in $(seq 1 18); do
            if curl -sf --max-time 5 -o /dev/null "$TARGET"; then ready=1; break; fi
            sleep 5
          done
          if [ "$ready" != "1" ]; then
            echo "::error::$TARGET never became reachable within 90s"
            exit 1
          fi

          # gy-pvi8y: the CDN propagation guard now runs FIRST and BLOCKS,
          # not after the content checks as a third thing that could fail.
          # Mid-propagation the edge can serve a MIX of old HTML and new JS
          # (or vice versa) — the two disagree and the page throws, which
          # console-check.mjs correctly reports as a real error even though
          # it is purely a propagation artifact, not a defect in this build.
          # Waiting here for build-sha.txt to match THIS run's commit before
          # asserting anything else removes that race at its source, rather
          # than retrying past it and reporting whichever of two different
          # answers happened to land (what produced the original 23/22 and
          # 6/22 split-brain result on run 32472712245).
          # Only meaningful against the real domain — a verify_url override
          # (negative-control testing) won't carry our build-sha.txt.
          if [ "$TARGET" = "https://getgymbo.com" ]; then
            synced=0
            for i in $(seq 1 18); do
              live_sha=$(curl -sf --max-time 5 "$TARGET/build-sha.txt" || echo "")
              if [ "$live_sha" = "${{ github.sha }}" ]; then synced=1; break; fi
              sleep 5
            done
            if [ "$synced" != "1" ]; then
              echo "::error::Live build-sha.txt ('$live_sha') never matched this run's commit (${{ github.sha }}) within 90s — deploy did not reach the CDN as expected."
              exit 1
            fi
            echo "OK   live build-sha.txt matches this deploy (${{ github.sha }})"
          fi

          run_check() {
            bash scripts/getgymbo-smoke.sh "$TARGET" || return 1
            node scripts/console-check.mjs "$TARGET" || return 1
            return 0
          }

          if run_check; then
            echo "Post-deploy live verification passed."
            exit 0
          fi

          # Retry once — now a genuine content-check retry, not a second
          # sample of the propagation race (that race is already resolved
          # above). A transient network blip must not page anyone.
          # Kaushik's constraint: this check must be trustworthy or it will
          # be ignored.
          echo "::warning::Post-deploy check failed once — retrying after a short backoff."
          sleep 10
          if run_check; then
            echo "Post-deploy live verification passed on retry."
            exit 0
          fi

          echo "::error::Post-deploy live verification FAILED against $TARGET after retry. The deploy already happened — this failure is a visible alert, not a rollback."
          exit 1
