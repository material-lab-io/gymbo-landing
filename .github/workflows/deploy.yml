name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Screenshot staleness gate (gy-a73px.15): every screenshot actually
      # rendered on the site must have a manifest entry in
      # public/screens/manifest.json that is verified and not older than
      # maxAgeDays — see public/screens/MANIFEST.md. Runs before the build
      # so a stale/missing manifest fails fast, before the full build +
      # smoke gate. Mechanical, fail-closed replacement for a human noticing
      # stale screenshots on the live site (happened twice: 2026-08-06,
      # 2026-08-08).
      - name: Screenshot staleness gate
        run: node scripts/check-screenshot-freshness.mjs

      - run: npm run build

      - name: Install Chromium (smoke-gate console check)
        run: npx playwright install --with-deps chromium

      # Pre-deploy smoke gate (gy-kefk3): serve the freshly-built dist via the
      # Cloudflare Pages emulator and (1) assert homepage rendered (SSG didn't
      # break) + key content/og + robots AI-bot regression + /privacy + /terms
      # live (curl smoke), (2) load every route in a headless browser and fail
      # on our JS/console errors (hydration etc.), and (3) run the Playwright
      # visual-regression baselines (gy-a73px.1 / gy-a73px.13) against the same
      # emulator — a PR that changes rendering with no snapshot update fails
      # here. Non-zero exit fails the job → the deploy step below is skipped.
      # Blocks bad builds from going live.
      - name: Pre-deploy smoke gate
        run: |
          npx wrangler pages dev dist --port 8788 --ip 127.0.0.1 > /tmp/pagesdev.log 2>&1 &
          PD=$!
          ready=0
          for i in $(seq 1 40); do
            if curl -sf -o /dev/null http://127.0.0.1:8788/; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            echo "::error::Pages emulator never became ready"; cat /tmp/pagesdev.log
            kill $PD 2>/dev/null || true; exit 1
          fi
          RC=0
          # Correctness gates — these BLOCK everywhere, including main. A broken
          # page or a console error must never reach production.
          bash scripts/getgymbo-smoke.sh http://127.0.0.1:8788 || RC=1
          node scripts/console-check.mjs http://127.0.0.1:8788 || RC=1

          # Visual regression is CHANGE DETECTION, not a correctness check: it
          # fails by design whenever a design change is intentional, until the
          # baselines are refreshed. Blocking production on it is what wedged
          # deploys on 2026-08-11 (five merges, five failed deploys, all on
          # hero-light.png as the diff grew 3,632px -> 49,701px).
          #
          # So: BLOCK on pull_request, where the question "did you mean to change
          # this?" is useful and the author can still act on it. WARN on main,
          # where the change has already been reviewed and merged and the only
          # thing blocking achieves is an undeployed site plus a manual rescue
          # commit. Refresh baselines via refresh-visual-baselines.yml.
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            PLAYWRIGHT_BASE_URL=http://127.0.0.1:8788 npx playwright test tests/visual.spec.ts --project=desktop --project=mobile \
              || echo "::warning::Visual baselines are stale on main — deploy proceeding. Run refresh-visual-baselines.yml to resync."
          else
            PLAYWRIGHT_BASE_URL=http://127.0.0.1:8788 npx playwright test tests/visual.spec.ts --project=desktop --project=mobile || RC=1
          fi
          kill $PD 2>/dev/null || true
          exit $RC

      - name: Upload visual regression report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      - name: Deploy to Cloudflare Pages
        if: github.ref == 'refs/heads/main'
        run: npx wrangler pages deploy dist --project-name gymbo-landing --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
