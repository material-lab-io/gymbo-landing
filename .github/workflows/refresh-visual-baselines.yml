# ╔═══════════════════════════════════════════════════════════════════════════╗
# ║  refresh-visual-baselines.yml                                             ║
# ║                                                                           ║
# ║  Regenerates the Playwright visual-regression baselines                  ║
# ║  (tests/visual.spec.ts-snapshots/*-linux.png) that deploy.yml's           ║
# ║  pre-deploy smoke gate checks pixel-for-pixel against. Runs on the        ║
# ║  SAME self-hosted gt2 runners the deploy gate uses — because              ║
# ║  Playwright screenshot baselines are sensitive to browser build and font  ║
# ║  rendering; baselines captured elsewhere will not reliably match what     ║
# ║  the gate compares against.                                              ║
# ║                                                                           ║
# ║  Reuses deploy.yml's exact playwright invocation (plus                   ║
# ║  --update-snapshots) so the refresh path and the gate path can never      ║
# ║  drift apart.                                                            ║
# ║                                                                           ║
# ║  Dispatch against the branch whose PR is failing on stale baselines.      ║
# ║  Regenerated PNGs are committed straight back to that branch.             ║
# ╚═══════════════════════════════════════════════════════════════════════════╝

name: Refresh Visual Baselines

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch to check out, regenerate baselines against, and commit back to'
        required: true

jobs:
  refresh:
    runs-on: [self-hosted, gt2]
    permissions:
      contents: write   # needed to commit + push the regenerated baselines

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      # --with-deps dropped deliberately: it shells out to apt-get and needs
      # root, which a self-hosted runner does not grant. The gt2 runners
      # already carry the Playwright system libraries and a warm
      # ~/.cache/ms-playwright, so this resolves from cache. Do NOT re-add
      # --with-deps when moving a job to self-hosted.
      - name: Install Chromium (visual regression baselines)
        run: npx playwright install chromium

      # gy-cjdtw: bind the preview server to a per-run free port so two jobs on
      # the shared gt2 host never collide on a fixed :4173 ('localhost:4173
      # already used'). playwright.config reads PW_PORT.
      - name: Pick a free preview port
        run: echo "PW_PORT=$(node -e 'const s=require("net").createServer();s.listen(0,"127.0.0.1",()=>{process.stdout.write(String(s.address().port));s.close()})')" >> "$GITHUB_ENV"

      # Same invocation as deploy.yml's pre-deploy smoke gate, plus
      # --update-snapshots. Keeping this identical to the gate's command is
      # the whole point — any drift here would produce baselines that pass
      # this job and still fail the gate.
      - name: Regenerate visual regression baselines
        run: npx playwright test tests/visual.spec.ts --project=desktop --project=mobile --update-snapshots

      - name: Upload regenerated baselines (for review before commit)
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines-${{ github.run_number }}
          path: tests/visual.spec.ts-snapshots/
          retention-days: 14

      - name: Commit and push regenerated baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tests/visual.spec.ts-snapshots/
          if git diff --staged --quiet; then
            echo "No baseline changes — nothing to commit."
          else
            # NOTE: deliberately NO "[skip ci]" marker here. GitHub scans the FULL
            # commit message, and a squash-merge concatenates this branch's commit
            # subjects into the merge body — dragging the marker onto main and
            # silently suppressing the production deploy. That caused the
            # 2026-08-09 and 2026-08-11 silent no-deploy incidents (gy-sa0fm), each
            # papered over with a manual "trigger redeploy" commit.
            # Letting CI re-run here is also what we want: after refreshing
            # baselines the checks SHOULD run again to prove the gate now passes.
            git commit -m "chore(ci): refresh visual regression baselines"
            git push origin HEAD:${{ inputs.ref }}
          fi
