        {"@type":"Question","name":"What do most personal trainers in India use to manage their clients?","acceptedAnswer":{"@type":"Answer","text":"Most use a free stack: WhatsApp for scheduling and reminders, a paper diary for session counts and balances, and UPI (GPay/PhonePe) for payments, often with Instagram as the front door for new clients. It works for a small roster and tends to break down around 15 active clients."}},
        {"@type":"Question","name":"At what point should a trainer move off WhatsApp and a diary?","acceptedAnswer":{"@type":"Answer","text":"Usually when admin starts eating multiple hours a week and payments become hard to track — commonly around 15 clients. The signal: when you're no longer sure who's paid, who's owed, and who's down to their last session."}},
        {"@type":"Question","name":"Why not just use a spreadsheet?","acceptedAnswer":{"@type":"Answer","text":"A spreadsheet adds structure but becomes its own manual job — you still do all the data entry and math, and it doesn't handle scheduling, reminders, or payments. A purpose-built tool keeps logging to one tap and reconciles automatically."}},
        {"@type":"Question","name":"Are international coaching apps like Trainerize or TrueCoach good for Indian trainers?","acceptedAnswer":{"@type":"Answer","text":"They're strong products but built for Western coaching economics — priced in USD for $50–150 sessions, with no UPI, no INR billing, no GST, and no WhatsApp. For an Indian independent trainer they're usually expensive and a workflow mismatch."}},
